name: sknet-dev
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
  frontend:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
    build:
      target: dependencies
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    environment:
      SKNET_API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

