name: sknet-dev
services:
  backend:
    environment:
      SKNET_CONNECTIVITY_MODE: ${SKNET_CONNECTIVITY_MODE:-simulation}
      SKNET_INSTALLATION_ID: ${SKNET_INSTALLATION_ID:-sknet-dev}
      SKNET_DOCKER_POOL: ${SKNET_DOCKER_POOL:-172.20.0.0/16}
      SKNET_WG_POOL: ${SKNET_WG_POOL:-10.200.1.0/24}
      SKNET_PROTECTED_NETWORKS: ${SKNET_PROTECTED_NETWORKS:-}
      SKNET_UDP_FIRST: ${SKNET_UDP_FIRST:-51820}
      SKNET_UDP_LAST: ${SKNET_UDP_LAST:-51919}
      SKNET_UDP_INTERNAL: ${SKNET_UDP_INTERNAL:-51820}
      SKNET_UDP_BIND: ${SKNET_UDP_BIND:-127.0.0.1}
      SKNET_WG_ENDPOINT: ${SKNET_WG_ENDPOINT:-127.0.0.1}
      SKNET_WG_MTU: ${SKNET_WG_MTU:-1420}
      SKNET_WG_KEEPALIVE: ${SKNET_WG_KEEPALIVE:-25}
      SKNET_COLLECTOR_HEARTBEAT: ${SKNET_COLLECTOR_HEARTBEAT:-10}
      SKNET_COLLECTOR_STALE: ${SKNET_COLLECTOR_STALE:-30}
      SKNET_ICMP_RETENTION_DAYS: ${SKNET_ICMP_RETENTION_DAYS:-30}
      SKNET_ORIGIN: ${SKNET_ORIGIN:-}
      SKNET_COOKIE_SECURE: ${SKNET_COOKIE_SECURE:-0}
      SKNET_SMTP_HOST: ${SKNET_SMTP_HOST:-}
      SKNET_SMTP_PORT: ${SKNET_SMTP_PORT:-587}
      SKNET_SMTP_FROM: ${SKNET_SMTP_FROM:-}
      SKNET_SMTP_USER: ${SKNET_SMTP_USER:-}
      SKNET_SMTP_PASSWORD: ${SKNET_SMTP_PASSWORD:-}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      - worker_api:/run/sknet-worker
      - collector_api:/run/sknet-collector
  provisioner:
    environment:
      SKNET_CONNECTIVITY_MODE: ${SKNET_CONNECTIVITY_MODE:-simulation}
      SKNET_COLLECTOR_IMAGE: ${SKNET_COLLECTOR_IMAGE:-sknet-collector:dev}
      SKNET_ICMP_CONCURRENCY: ${SKNET_ICMP_CONCURRENCY:-10}
      SKNET_COLLECTOR_API_VOLUME: ${SKNET_COLLECTOR_API_VOLUME:-sknet-dev-collector-api}
    restart: unless-stopped
    volumes:
      - worker_api:/run/sknet-worker:ro
      - provisioner_secrets:/var/lib/sknet-provisioner
  frontend:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
    build:
      target: dependencies
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    environment:
      SKNET_API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:8080"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  worker_api:
  collector_api:
    name: ${SKNET_COLLECTOR_API_VOLUME:-sknet-dev-collector-api}
  provisioner_secrets:

